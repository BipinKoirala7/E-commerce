events {
    worker_connections 1024;
}

http {
    access_log  /etc/nginx/access.log;
    error_log /etc/nginx/error.log;

    server {
        listen 4000;
        server_name localhost;

        # Forward /api/* requests to your backend
        location /api/ {
            proxy_pass http://localhost:8080/api/v1/;
            proxy_http_version 1.1;

            # Forwarding headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Port $server_port;

            # Cookies and other headers
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass cookies
            proxy_cookie_domain localhost localhost;
            proxy_cookie_path /api/v1 /api;
            proxy_pass_header Set-Cookie;
            proxy_redirect http://localhost:8080/api/v1/ http://localhost:4000/api/;
        }

        # Forward everything else to your frontend
        location / {
            proxy_pass http://localhost:3000/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
        }
    }
}
