server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: product-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC