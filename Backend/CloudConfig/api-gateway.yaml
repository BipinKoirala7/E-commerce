server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: FRAMEWORK
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api/v1}
app:
  cors:
    allowed-methods: ${APP_CORS_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-Requested-With,Cache-Control}
    exposed-headers: ${APP_CORS_EXPOSED_HEADERS:Authorization,Access-Control-Allow-Origin,Access-Control-Allow-Credentials}
    allow-credentials: ${APP_CORS_CREDENTIALS:true}
    max-age: ${APP_CORS_MAX_AGE:3600}
  gateway:
    strip-prefix: ${APP_GATEWAY_STRIP_PREFIX:2}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      mvc:
        http-client:
          type: autodetect
          connect-timeout: 60s
          read-timeout: 60s